baseURL: 'https://www.sniperjoy.com/'
title: 斯奈波喬伊 SNIPERJOY Film Studio
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Sniperjoy
  authorimage: ../assets/images/global/main.png
  og_image: /images/Gemini_Generated_Image_86.png
  moto: ""
  description: "斯奈波喬伊 Sniperjoy — 影像製作團隊，提供商業廣告TVC、政府形象影片、品牌紀錄片、平面攝影等服務。"
  disable_theme_toggle: false
  newsletter_signup: false

  p1:
    heading: "斯奈波喬伊 Sniperjoy"
    image: "images/pages/main.png"
    content:
      - text: "專注影像製作十年，從 30 秒商業廣告到深度紀錄片，服務客戶涵蓋品牌企業、政府機關與文化單位。"
      - text: "從台南發跡，走遍台灣，高山海邊，只要是為了實現客戶心目中的畫面，我們就帶著器材出發。"
      - text: "高規格設備、完整製作團隊，精準掌握每一種拍攝環境——低光源現場、商業棚拍、戶外紀實，全都到位。"
  p2:
    heading: "我們的服務"
    image: "images/pages/main.png"
    content:
      - text: "商業 TVC、政府形象影片、品牌紀錄片、活動攝影——無論規模大小，我們都能從前期規劃到後製交付，一手包辦。"
      - text: "合作客戶涵蓋品牌企業、政府機關與文化單位，包含勝昌製藥、威技電器、臺南市政府等。"

  p3:
    heading: "合作過的品牌"
    content:
      - text: "從南部發跡，服務超過數十個品牌與單位。每一次合作，都是一次對影像品質的承諾。"
    logos: []
 
  social_media:
    facebook:
      enabled: true
      url: 'https://www.facebook.com/profile.php?id=61572563786925'
    instagram:
      enabled: true
      url: 'https://www.instagram.com/chuanx.officialll/'
    

menu:
  main:
    - identifier: prose
      name: 影像作品
      url: /prose/
      weight: 10
    - identifier: about
      name: 關於我們
      url: /about/
      weight: 20
    - identifier: contact
      name: 聯絡我們
      url: /contact/
      weight: 50
  categories:
    - identifier: prose
      name: Prose
      url: /prose/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
  dropdown:
    - identifier: appearance
      pre: stars # can be stars, comments or piechart
      name: Appearance
      post: "Easy customization"
      url: "#"
      weight: 10
    - identifier: comments
      pre: comments # can be stars, comments or piechart
      name: Comments
      post: "Check your latest comments"
      url: "#"
      weight: 20
    - identifier: analytics
      pre: piechart # can be stars, comments or piechart
      name: Analytics
      post: "Take a look at your statistics"
      url: "#"
      weight: 30

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.148.2"

# Performance optimizations
caches:
  assets:
    dir: :cacheDir/assets
    maxAge: "0s" # Disable caching in development

  images:
    dir: :cacheDir/images
    maxAge: 8760h # 1 year
  modules:
    dir: :cacheDir/modules
    maxAge: 8760h # 1 year

# Image processing defaults
imaging:
  quality: 85
  resampleFilter: lanczos
  anchor: smart
