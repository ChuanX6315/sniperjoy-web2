<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">

<head>
    {{ partial "head.html" . }}
    <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .page-fade {
        animation: fadeIn 0.5s ease forwards;
    }
    *, *::before, *::after {
        transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .scroll-fade {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .scroll-fade.visible {
        opacity: 1;
        transform: translateY(0);
    }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-950">
    {{ partial "nav.html" . }}
    <div class="page-fade">
        {{ block "main" . }}{{ end }}
    </div>
    {{ partial "footer" . }}
    <script>
    document.querySelectorAll('a').forEach(function(link) {
        var href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto')) return;
        link.addEventListener('click', function(e) {
            e.preventDefault();
            var target = this.href;
            document.querySelector('.page-fade').style.animation = 'none';
            document.querySelector('.page-fade').style.opacity = '0';
            document.querySelector('.page-fade').style.transition = 'opacity 0.3s ease';
            setTimeout(function() {
                window.location.href = target;
            }, 300);
        });
    });

    const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.15 });

    document.querySelectorAll('.scroll-fade').forEach(function(el) {
        observer.observe(el);
    });
    function updateLogo() {
    var isDark = document.documentElement.classList.contains('dark');
    var light = document.getElementById('logo-light');
    var dark = document.getElementById('logo-dark');
    if (light) light.style.display = isDark ? 'none' : 'block';
    if (dark) dark.style.display = isDark ? 'block' : 'none';
}
updateLogo();
    </script>
</body>

</html>
