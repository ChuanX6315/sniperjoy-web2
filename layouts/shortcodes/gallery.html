{{ $images := split .Params.images "," }}
{{ $title := .Params.title }}

{{ if $title }}
<h3 style="font-size:1.5rem; font-weight:800; margin-bottom:1rem; padding-bottom:0.5rem; border-bottom:2px solid #444;">{{ $title }}</h3>
{{ end }}

<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:0.75rem; margin-bottom:2rem;">
  {{ range $i, $img := $images }}
<img src="{{ strings.TrimSpace $img }}"
       data-gallery="{{ $title }}"
       data-index="{{ $i }}"
       style="width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:0.5rem; cursor:pointer;"
       onclick="openLB(this)"
       loading="eager">
  {{ end }}
</div>

<div id="lb" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9999; align-items:center; justify-content:center;" onclick="closeLB()">
  <button onclick="event.stopPropagation();moveLB(-1)" style="position:absolute;left:1.5rem;background:none;border:none;color:white;font-size:4rem;cursor:pointer;">&#8249;</button>
  <img id="lb-img" style="max-height:90vh;max-width:85vw;border-radius:0.5rem;object-fit:contain;">
  <button onclick="event.stopPropagation();moveLB(1)" style="position:absolute;right:1.5rem;background:none;border:none;color:white;font-size:4rem;cursor:pointer;">&#8250;</button>
  <button onclick="closeLB()" style="position:absolute;top:1rem;right:1.5rem;background:none;border:none;color:white;font-size:2rem;cursor:pointer;">&#10005;</button>
</div>

<script>
(function(){
  var imgs = [], idx = 0;
  window.openLB = function(el) {
    var g = el.getAttribute('data-gallery');
    imgs = Array.from(document.querySelectorAll('img[data-gallery="'+g+'"]'));
    idx = parseInt(el.getAttribute('data-index'));
    document.getElementById('lb-img').src = imgs[idx].src;
    var lb = document.getElementById('lb');
    lb.style.display = 'flex';
    document.addEventListener('keydown', onKey);
  };
  window.closeLB = function() {
    document.getElementById('lb').style.display = 'none';
    document.removeEventListener('keydown', onKey);
  };
  window.moveLB = function(dir) {
    idx = (idx + dir + imgs.length) % imgs.length;
    document.getElementById('lb-img').src = imgs[idx].src;
  };
  function onKey(e) {
    if(e.key==='ArrowLeft') moveLB(-1);
    if(e.key==='ArrowRight') moveLB(1);
    if(e.key==='Escape') closeLB();
  }
})();
</script>
