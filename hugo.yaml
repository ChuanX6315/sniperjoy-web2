baseURL: 'https://www.sniperjoy.com/'
title: SNIPERJOY
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Sniperjoy
  authorimage: ../assets/images/global/main.png
  og_image: /images/Gemini_Generated_Image_86.png
  moto: ""
  description: "專注攝影與紀錄"
  disable_theme_toggle: false
  newsletter_signup: false

  p1:
    heading: "斯奈波喬伊"
    image: "images/pages/main.png"
    content:
      - text: "斯奈波喬伊致力於影像製作，從音樂錄影帶到活動紀錄，從活動轉播到劇情片，都能帶給您最優質的角度與視野。"
      - text: "從南部發跡，在台灣四處闖蕩，為了捕捉客戶心目中的畫面。"
      - text: "堅持使用高規格硬體，有著完善且堅強的團隊，確保每一張照片與每一段影片都能擁有極致的畫質與寬容度。無論是低光源的活動現場，還是需要高精度紀錄的商業攝影，我們都能精準掌握。"

 
  social_media:
    github:
      enabled: true
      url: 'https://github.com/ChuanX6315'
    facebook:
      enabled: true
      url: 'https://www.facebook.com/share/1ETSUJ1qPz/?mibextid=wwXIfr'
    instagram:
      enabled: true
      url: 'https://www.instagram.com/chuanx.officialll/'
    twitter:
      enabled: true
      url: 'https://twitter.com/we_nmixx'
    

menu:
  main:
    - identifier: prose
      name: 攝影作品
      url: /prose/
      weight: 10
    - identifier: about
      name: 關於我們
      url: /about/
      weight: 20
    - identifier: contact
      name: 聯絡我們
      url: /contact/
      weight: 50
  categories:
    - identifier: prose
      name: Prose
      url: /prose/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
  dropdown:
    - identifier: appearance
      pre: stars # can be stars, comments or piechart
      name: Appearance
      post: "Easy customization"
      url: "#"
      weight: 10
    - identifier: comments
      pre: comments # can be stars, comments or piechart
      name: Comments
      post: "Check your latest comments"
      url: "#"
      weight: 20
    - identifier: analytics
      pre: piechart # can be stars, comments or piechart
      name: Analytics
      post: "Take a look at your statistics"
      url: "#"
      weight: 30

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.148.2"

# Performance optimizations
caches:
  assets:
    dir: :cacheDir/assets
    maxAge: "0s" # Disable caching in development

  images:
    dir: :cacheDir/images
    maxAge: 8760h # 1 year
  modules:
    dir: :cacheDir/modules
    maxAge: 8760h # 1 year

# Image processing defaults
imaging:
  quality: 85
  resampleFilter: lanczos
  anchor: smart
