{{ $raw := .Params.images }}{{ $images := slice }}{{ range split $raw "," }}{{ $s := . | replaceRE "^\\s+|\\s+$" "" }}{{ if $s }}{{ $images = $images | append $s }}{{ end }}{{ end }}
{{ $title := .Params.title }}

{{ if $title }}
<h3 style="font-size:1.5rem; font-weight:800; margin-bottom:1rem; padding-bottom:0.5rem; border-bottom:2px solid #444;">{{ $title }}</h3>
{{ end }}

<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:0.75rem; margin-bottom:2rem;">
  {{ range $i, $img := $images }}
  <img src="{{ $img }}"
       data-gallery="{{ $title }}"
       data-index="{{ $i }}"
       style="width:100%; object-fit:contain; border-radius:0.5rem; cursor:pointer; background:#111; transition: transform 0.3s ease, box-shadow 0.3s ease;"
       onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 8px 30px rgba(0,0,0,0.4)';"
       onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='none';"
       onclick="openLB(this)"
       loading="lazy">
  {{ end }}
</div>

<script>
if (!document.getElementById('lb')) {

  var _lb = document.createElement('div');
  _lb.id = 'lb';
  _lb.style.cssText = 'display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:99999; align-items:center; justify-content:center; overflow:hidden;';
  _lb.innerHTML = `
    <button onclick="event.stopPropagation();moveLB(-1)" style="position:absolute;left:0.5rem;top:50%;transform:translateY(-50%);background:none;border:none;color:white;font-size:3rem;cursor:pointer;z-index:100000;">&#8249;</button>
    <img id="lb-img" style="max-height:85vh;max-width:90vw;border-radius:0.5rem;object-fit:contain;display:block;">
    <button onclick="event.stopPropagation();moveLB(1)" style="position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);background:none;border:none;color:white;font-size:3rem;cursor:pointer;z-index:100000;">&#8250;</button>
    <button onclick="closeLB()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:white;font-size:2rem;cursor:pointer;z-index:100000;">&#10005;</button>
  `;
  _lb.onclick = function(e) { if(e.target === _lb) closeLB(); };
  document.body.appendChild(_lb);

  var imgs = [], idx = 0;

  window.openLB = function(el) {
    var g = el.getAttribute('data-gallery');
    imgs = Array.from(document.querySelectorAll('img[data-gallery="'+g+'"]'));
    idx = parseInt(el.getAttribute('data-index'));
    var lb = document.getElementById('lb');
    var lbImg = document.getElementById('lb-img');
    lbImg.src = imgs[idx].src;
    lb.style.opacity = '0';
    lb.style.display = 'flex';
    lb.style.transition = 'opacity 0.3s ease';
    setTimeout(function() { lb.style.opacity = '1'; }, 10);
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.width = '100%';
    document.addEventListener('keydown', onKey);
  };

  window.closeLB = function() {
    var lb = document.getElementById('lb');
    lb.style.opacity = '0';
    setTimeout(function() {
      lb.style.display = 'none';
      document.body.style.overflow = '';
      document.body.style.position = '';
      document.body.style.width = '';
    }, 300);
    document.removeEventListener('keydown', onKey);
  };

  window.moveLB = function(dir) {
    idx = (idx + dir + imgs.length) % imgs.length;
    var lbImg = document.getElementById('lb-img');
    lbImg.style.transition = 'opacity 0.2s ease';
    lbImg.style.opacity = '0';
    setTimeout(function() {
      lbImg.src = imgs[idx].src;
      lbImg.style.opacity = '1';
    }, 200);
  };

  function onKey(e) {
    if(e.key==='ArrowLeft') moveLB(-1);
    if(e.key==='ArrowRight') moveLB(1);
    if(e.key==='Escape') closeLB();
  }
}
</script>
